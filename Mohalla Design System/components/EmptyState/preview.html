<!-- @dsCard group="Feedback" height=720 subtitle="No results in this locality · offline" -->
<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0} body{background:var(--surface-page);padding:16px} </style>
</head>
<body>
<div class="mh">
<div style="display:grid;gap:16px;max-width:420px">
<section class="mh-empty" aria-live="polite">
  <div class="mh-empty__icon"><svg class="mh-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/><path d="m13.5 8.5-5 5M8.5 8.5l5 5"/></svg></div>
  <h2 class="mh-empty__title">No tutors in Baner yet</h2>
  <p class="mh-empty__body">We couldn’t find a verified tutor here. These nearby areas have some:</p>
  <div class="mh-empty__nearby"><button class="mh-chip" type="button">Balewadi · 12</button><button class="mh-chip" type="button">Aundh · 8</button></div>
  <div class="mh-empty__actions"><button class="mh-btn mh-btn--call" type="button">Search within 5 km</button><button class="mh-btn mh-btn--ghost" type="button">Recommend someone</button></div>
</section>
<section class="mh-empty mh-empty--error" role="alert">
  <div class="mh-empty__icon"><svg class="mh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/></svg></div>
  <h2 class="mh-empty__title">You’re offline</h2>
  <p class="mh-empty__body">Results will load when you’re back online. Saved providers still work.</p>
  <div class="mh-empty__actions"><button class="mh-btn mh-btn--secondary" type="button">Try again</button></div>
</section>
</div>
</div>
</body>
</html>
