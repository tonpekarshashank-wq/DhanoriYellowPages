<!-- @dsCard group="Search" height=380 subtitle="Centred master search, inline category, sub-locality chips" -->
<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0} body{background:var(--surface-page);padding:16px} </style>
</head>
<body>
<div class="mh">
<div style="max-width:560px;display:grid;gap:16px;margin:-16px">
<header class="mh-header" role="search">
  <h1 style="margin:0;font-family:var(--font-display);font-size:28px;line-height:34px;font-weight:800;letter-spacing:-0.02em">Find help near you</h1>
  <label class="mh-search">
    <svg class="mh-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="search" placeholder="Electrician, tutor, tiffin…" aria-label="Search services">
    <button class="mh-search__cat" type="button" aria-haspopup="listbox">All categories<svg class="mh-icon mh-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  </label>
  <div class="mh-chips" role="group" aria-label="Sub-locality">
    <button class="mh-chip mh-chip--active" type="button" aria-pressed="true"><svg class="mh-icon mh-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Baner<svg class="mh-icon mh-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <button class="mh-chip" type="button" aria-pressed="false">Balewadi</button>
    <button class="mh-chip" type="button" aria-pressed="false">Aundh</button>
    <button class="mh-chip" type="button" aria-pressed="false">Pashan</button>
    <button class="mh-chip" type="button" aria-pressed="false">Sus Road</button>
    <button class="mh-chip" type="button" aria-pressed="false">Open now</button>
  </div>
</header>
<header class="mh-header mh-header--stuck" role="search">
  <label class="mh-search">
    <svg class="mh-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="search" value="plumb" aria-label="Search services">
    <button class="mh-search__cat" type="button" aria-haspopup="listbox">Plumber<svg class="mh-icon mh-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
  </label>
  <div class="meta" style="font-size:14px;line-height:20px;font-weight:500;color:var(--ink-muted)">18 results for <mark class="mh-mark">plumb</mark>ing in <b style="color:var(--ink)">Baner</b></div>
</header>
</div>
</div>
</body>
</html>
